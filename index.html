<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>綠智識</title>
<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:system-ui, -apple-system, sans-serif
}
body{
    background:#f4f7f5;
    color:#222;
    padding:16px
}
.top-bar{
    background:#2e7d32;
    color:#fff;
    padding:14px;
    border-radius:10px;
    margin-bottom:16px;
    text-align:center;
    font-size:18px;
    font-weight:bold
}
/* 活動Banner樣式 */
.banner-img{
    width:100%;
    border-radius:10px;
    margin-bottom:16px;
}
.search-box{
    background:#fff;
    padding:10px;
    border-radius:8px;
    margin-bottom:10px
}
#searchInput{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px
}
.card{
    background:#fff;
    padding:14px;
    border-radius:10px;
    margin-bottom:12px;
    box-shadow:0 2px 6px #00000010;
}
.card-img{
    width:100%;
    max-width:180px;
    height:auto;
    object-fit:cover;
    border-radius:6px;
    margin-bottom:8px;
}
</style>
</head>
<body>
<div class="top-bar">綠智識</div>

<!-- ===== 新增：廢紙回收2倍賞 Banner ===== -->
     <h1>2026年12月23日至2027年1月31日
    "廢紙回收2倍賞活動"</h1>

<div class="search-box">
    <input id="searchInput" placeholder="輸入物品查詢回收分類，例如：發泡膠、鋁罐、玻璃樽、金屬">
</div>
<div id="recycleList"></div>

<script>
const recycleDB = [
    {
        name:"鋁罐 / 金屬罐",
        type:"金屬",
        note:"沖洗乾淨，去除拉環，不需壓扁",
        imgSrc:"https://picsum.photos/id/60/200/200"
    },
    {
        name:"塑膠樽 PET",
        type:"塑膠",
        note:"沖洗，移除膠蓋、標籤",
        imgSrc:""
    },
    {
        name:"玻璃樽",
        type:"玻璃",
        note:"沖洗，小心碎玻璃；燈泡不屬玻璃回收",
        imgSrc:""
    },
    {
        name:"報紙、紙皮",
        type:"紙類",
        note:"保持乾爽，不要沾油；不要混入發泡膠",
        imgSrc:""
    },
    {
        name:"發泡膠",
        type:"不易回收",
        note:"大部份回收點不接收，先查詢就近回收點",
        imgSrc:""
    },
    {
        name:"廚餘",
        type:"廚餘",
        note:"去除包裝，不要混入膠袋、牙籤",
        imgSrc:""
    }
];
const searchInput = document.getElementById("searchInput");
const recycleList = document.getElementById("recycleList");

function renderRecycle(keyword=""){
    recycleList.innerHTML = "";
    const kw = keyword.toLowerCase();
    const result = recycleDB.filter(item=>
        item.name.toLowerCase().includes(kw) || item.type.toLowerCase().includes(kw)
    );
    if(result.length===0){
        recycleList.innerHTML="<div class='card'>找不到相關物品</div>";
        return;
    }
    result.forEach(item=>{
        const div = document.createElement("div");
        div.className="card";
        let imgHtml = "";
        if(item.imgSrc){
            imgHtml = `<img class="card-img" src="${item.imgSrc}" alt="${item.name}">`;
        }
        div.innerHTML = `
            ${imgHtml}
            <div><strong>${item.name}</strong></div>
            <div>分類：${item.type}</div>
            <div>備註：${item.note}</div>
        `;
        recycleList.appendChild(div);
    })
}
searchInput.oninput = ()=> renderRecycle(searchInput.value);
renderRecycle();
</script>
</body>
</html>
